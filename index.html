<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next 인프라 방법론 조사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#fafbfc; --panel:#fff; --ink:#1f2a37; --muted:#667385; --line:#e3e8ee; --chip:#f3f6f9;
  --land:#fff; --border:#cfd8e3; --sea:#f2f6fa; --accent:#3d6fa8;
  --tgt:#fff3c4; --tgtS:#e2b93b; --tgtInk:#8a6a00; --own:#2f4a6e; --hub:#6d879f;
  --ex:#d9a62e; --im:#4f8fcc; --comp:#c4705a; --pub:#9aa9ba; --m1:#4f8fcc; --m2:#c4705a; --m3:#5c9c7a;
  color-scheme:light;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-size:24px;font-weight:700}
.funnel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.funnel .n{font-family:var(--f-num);font-weight:600;font-size:15px}
.funnel .step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:flex;gap:6px;align-items:baseline}
.funnel .step.fin{background:var(--tgt);border-color:var(--tgtS)}
.funnel .arr{color:var(--muted)}
.funnel small{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .c{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.tab.tgt[aria-selected="true"]{background:var(--tgt);border-color:var(--tgtS);color:var(--tgtInk)}
.tab.raw{margin-left:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.fg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fg>label{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--panel);font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tg{appearance:none;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tg i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--muted);display:inline-block}
.tg[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tg[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent)}
.tg.big{font-size:13.5px;font-weight:600;padding:6px 14px}
select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--panel)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mapcard{position:relative;padding:10px;min-width:0}
svg#map{width:100%;height:auto;display:block;background:var(--sea);border-radius:8px}
.prov{fill:var(--land);stroke:var(--border);stroke-width:1}
.muni{stroke:#dfe6ee;stroke-width:.5}
.plabel{font-size:11px;fill:#a0acba;pointer-events:none}
.lab{font-size:10.5px;fill:var(--ink);font-weight:600;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.tlab{font-size:13.5px;font-weight:700;fill:var(--tgtInk);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px}
.hit{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:270px;line-height:1.45;opacity:0;transition:opacity .12s;z-index:5}
.tip b{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 4px 2px;font-size:11.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--chip);border-radius:8px;padding:8px 10px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.ch{display:flex;flex-direction:column;gap:6px}
.ch h3{margin:0;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ch h3 span{font-weight:500}
.br{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:12.5px}
.br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tr{height:12px;background:var(--chip);border-radius:3px;display:flex;overflow:hidden}
.br .tr i{display:block;height:100%}
.br .vv{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.stk{height:22px;display:flex;border-radius:5px;overflow:hidden;font-size:11px;font-weight:600;color:#fff}
.stk i{display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap;overflow:hidden;min-width:0}
.stkl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.stkl b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.stkrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.guide{display:flex;flex-direction:column;gap:6px}
.guide h3{margin:0 0 2px;font-size:12.5px;color:var(--muted)}
.gi{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;border-left:3px solid var(--tgtS);background:#fffbea;padding:7px 10px;border-radius:0 6px 6px 0}
.gi .no{font-family:var(--f-num);font-weight:600;color:var(--tgtInk)}
.gi b{font-size:13.5px}
.gi span{display:block;font-size:12px;color:var(--muted)}
.hl{background:var(--tgt);border:1px solid var(--tgtS);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hl .t{font-size:16px;font-weight:700}
.hl .t small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.hl .sc{font-family:var(--f-num);font-size:26px;font-weight:600;color:var(--tgtInk)}
.hl .sc small{font-size:11px;color:var(--muted);display:block;text-align:right}
.eff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ef{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ef .l{font-size:12px;font-weight:600}
.ef .v{font-family:var(--f-num);font-size:17px;font-weight:600;color:var(--accent)}
.ef .s{font-size:11.5px;color:var(--muted)}
.src{font-size:11px;color:var(--muted)}
.rawwrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.st{appearance:none;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.st[aria-selected="true"]{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.meta{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:12.5px;background:var(--chip);border-radius:8px;padding:10px 12px}
.meta dt{color:var(--muted)}.meta dd{margin:0;word-break:break-all}.meta a{color:var(--accent)}
.tblbox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:560px;overflow-y:auto}
table.raw{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.raw th{position:sticky;top:0;background:var(--chip);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.raw td{padding:6px 10px;border-bottom:1px solid var(--line)}
.raw td.v{font-family:var(--f-num);text-align:right;white-space:nowrap}
.raw tr.hl td{background:var(--tgt)}
.foot{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">국내사업부 · 컨테이너 부문</div><h1>Next 인프라 진입을 위한 방법론 조사</h1></div>
    <div class="funnel" aria-label="방법론 선정 과정">
      <div class="step"><span class="n">12</span>개 방법론 POOL</div><span class="arr">→</span>
      <div class="step"><small>적합도 평가</small>사업효과 · 실현성 · 데이터확보 · 투자부담</div><span class="arr">→</span>
      <div class="step fin"><span class="n">3</span>개 최종 <small>수출입 물동량 · 철송/경쟁 CY · 제조 화주 집적</small></div>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="분석 화면">
    <button class="tab" role="tab" data-t="A" id="tab-A"><span class="c">①</span>수출입 물동량 흐름</button>
    <button class="tab" role="tab" data-t="B" id="tab-B"><span class="c">②</span>철송 · 경쟁 CY</button>
    <button class="tab" role="tab" data-t="C" id="tab-C"><span class="c">③</span>제조 화주 집적도</button>
    <button class="tab tgt" role="tab" data-t="T" id="tab-T"><span class="c">①+②+③</span>종합 Target 거점</button>
    <button class="tab raw" role="tab" data-t="RAW" id="tab-RAW"><span class="c">DATA</span>로우데이터</button>
  </nav>
  <div class="fbar" id="fbar"></div>
  <div class="grid" id="mapview">
    <section class="card mapcard" aria-label="지도">
      <svg id="map" role="img" aria-label="대한민국 지도"></svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip"></div>
    </section>
    <section class="card panel" id="panel" aria-live="polite"></section>
  </div>
  <section class="card rawwrap" id="rawview" hidden>
    <div class="subtabs" role="tablist" aria-label="로우데이터">
      <button class="st" role="tab" data-r="kcs">관세청 시군구 수출입</button>
      <button class="st" role="tab" data-r="teu">TEU 환산 가정</button>
      <button class="st" role="tab" data-r="infra">철도 CY · 운영사</button>
      <button class="st" role="tab" data-r="flow">부산진CY 철송 흐름</button>
      <button class="st" role="tab" data-r="agg">산단 시군 집계</button>
      <button class="st" role="tab" data-r="nat">국가산단</button>
      <button class="st" role="tab" data-r="gen">일반산단(상위 40)</button>
      <button class="st" role="tab" data-r="rail">코레일 물류시설</button>
    </div>
    <div id="rawbody" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
  <p class="foot">좌표는 시군구 · 역 지명 기준 개략 · 제주 제외 · TEU는 관세청 금액에서 환산한 추정치 · 원자료는 로우데이터 탭</p>
</div>

const tipEl=document.getElementById('tip'),mapCard=document.querySelector('.mapcard');
function tip(ev,h){tipEl.innerHTML=h;const r=mapCard.getBoundingClientRect();let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;if(x>r.width-280)x=ev.clientX-r.left-280;tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.style.opacity=1}
function hide(){tipEl.style.opacity=0}
function on(e,h){e.classList.add('hit');e.addEventListener('mousemove',ev=>tip(ev,h));e.addEventListener('mouseleave',hide);return e}
function txt(x,y,s,cls,anc,p){const e=el('text',{x,y,class:cls||'lab','text-anchor':anc||'start'},p||Lo);e.textContent=s;return e}
function star(cx,cy,R1,r){let d='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r:R1;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)}return d+'Z'}
function curve(a,b,bend){const x1=px(a.lon),y1=py(a.lat),x2=px(b.lon),y2=py(b.lat);const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;return `M${x1},${y1} Q${mx-dy*bend},${my+dx*bend} ${x2},${y2}`}

    else if(d.type==='select'){g.innerHTML=`<label>${d.label}</label>`;const s=document.createElement('select');d.opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o)});s.value=S[d.k];s.onchange=()=>{S[d.k]=s.value;cb()};g.appendChild(s)}
    else{g.innerHTML=`<label>${d.label}</label>`;const sg=document.createElement('div');sg.className='seg';d.opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed',S[d.k]===v);b.onclick=()=>{S[d.k]=v;cb()};sg.appendChild(b)});g.appendChild(sg)}

function bars(title,rows,opt={}){const max=Math.max(1,...rows.map(r=>r.parts.reduce((a,p)=>a+p.v,0)));

function stack(parts,label){const tot=parts.reduce((a,p)=>a+p.v,0)||1;return `<div class="stkrow"><span>${label||''}</span><div class="stk">${parts.map(p=>`<i style="width:${p.v/tot*100}%;background:${p.c}" title="${p.n} ${Math.round(p.v/tot*100)}%">${p.v/tot>.09?(p.short||p.n)+' '+Math.round(p.v/tot*100)+'%':''}</i>`).join('')}</div></div>`}
